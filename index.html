<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Great Bugs Heist: Soccer Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            overflow: hidden; /* Prevent scrolling */
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas when appropriate */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .panel {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #555;
            pointer-events: auto; /* Re-enable clicks for UI elements */
            text-align: center;
            margin-bottom: 20px;
        }

        #lobby {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #room-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid #555;
            padding-top: 15px;
        }

        #stadium-selection {
            display: none; /* Hidden until host */
        }

        #game-ui {
            display: none;
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            justify-content: space-between;
            padding: 0 50px;
            box-sizing: border-box;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
        }

        #post-match-ui {
            display: none;
        }

        input, select, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hidden {
            display: none !important;
        }
    </style>
    <!-- Import Maps for Three.js and Supabase -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm"
        }
      }
    </script>
</head>
<body>

    <div id="ui-layer">

        <div id="lobby" class="panel">
            <h1>Welcome to Bug Soccer!</h1>
            <div>
                <label for="playerName">Name:</label>
                <input type="text" id="playerName" placeholder="Enter your name" maxlength="15">
            </div>
            <div>
                <label for="playerGender">Gender:</label>
                <select id="playerGender">
                    <option value="man">Man</option>
                    <option value="woman">Woman</option>
                </select>
            </div>

            <div id="room-controls">
                <button id="createGameBtn">Create New Game</button>
                <p>OR</p>
                <div>
                    <input type="text" id="roomCodeInput" placeholder="Enter Room Code">
                    <button id="joinGameBtn">Join Game</button>
                </div>
            </div>

            <div id="lobbyStatus" class="hidden">
                <h2>Room Code: <span id="displayRoomCode"></span></h2>
                <p>Players connected: <span id="playerCount">0</span>/4 (Minimum)</p>
                <p id="waitingMessage">Waiting for more players...</p>
                <ul id="playerList" style="list-style: none; padding: 0;"></ul>
            </div>
        </div>

        <div id="stadium-selection" class="panel">
            <h2>You are the Host!</h2>
            <p>Select a stadium to start the match:</p>
            <select id="stadiumSelect">
                <option value="con_classic">Con Classic Stadium</option>
                <option value="flag_arena">FLAG Arena</option>
                <option value="ccp_arena">CCP Arena</option>
            </select>
            <button id="startMatchBtn" disabled>Start Match</button>
        </div>

        <div id="post-match-ui" class="panel">
            <h2>Match Finished!</h2>
            <p id="matchResult">Red Team Wins!</p>
            <div id="hostControls" class="hidden">
                <button id="rematchBtn">Rematch (Same Teams)</button>
                <button id="swapTeamsBtn">Rematch (Swap Teams)</button>
            </div>
            <p id="waitingHostMessage">Waiting for host to decide...</p>
        </div>

    </div>

    <div id="game-ui">
        <div id="scoreBoard">Red: 0 - Blue: 0</div>
        <div id="timer">04:30</div>
    </div>

    <!-- WebGL Canvas will be injected or managed by Three.js, but we can provide an anchor -->
    <div id="canvas-container" style="position: absolute; top:0; left:0; width:100%; height:100%; z-index:1;"></div>

    <script type="module" src="src/Game.js"></script>
</body>
</html>
