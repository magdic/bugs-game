<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bugs Woods</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
        }
        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .ui-panel {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        input {
            padding: 10px;
            font-size: 16px;
        }
        #scoreboard {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            font-size: 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="ui">
            <div id="lobby" class="ui-panel">
                <h1>Bugs Woods</h1>
                <input type="text" id="playerName" placeholder="Enter your name">
                <br>
                <button id="btnCreateRoom">Create Room</button>
                <br>
                <hr>
                <input type="text" id="roomCodeInput" placeholder="Room Code (4 chars)" maxlength="4">
                <button id="btnJoinRoom">Join Room</button>
            </div>

            <div id="room" class="ui-panel" style="display: none;">
                <h2>Room: <span id="roomCodeDisplay"></span></h2>
                <div id="playerList"></div>
                <button id="btnStartGame" style="display: none;">Start Game</button>
            </div>

            <div id="scoreboard">
                <span style="color: #4CAF50;">Lumberjacks: <span id="scoreLumberjacks">0</span></span> |
                <span style="color: #F44336;">Wolves: <span id="scoreWolves">0</span></span>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
